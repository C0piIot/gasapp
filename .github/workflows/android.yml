name: Android
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g @bubblewrap/cli@1.27.0

      # Bubblewrap only recognises the legacy SDK layout (tools/bin/sdkmanager)
      # and would otherwise prompt interactively to install its build-tools.
      - name: Prepare Android SDK
        run: |
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/tools/bin/sdkmanager" "build-tools;36.1.0"

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          jq -n --arg jdk "$JAVA_HOME" --arg sdk "$ANDROID_HOME" \
            '{jdkPath: $jdk, androidSdkPath: $sdk}' > ~/.bubblewrap/config.json
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > signing.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      # Epoch minutes keep versionCode monotonic without storing state, and stay
      # well under Play's 2100000000 ceiling.
      - name: Set version
        run: |
          jq --argjson code "$(( $(date +%s) / 60 ))" --arg name "$(date +%Y.%m.%d).$(git rev-parse --short HEAD)" \
            '.appVersionCode = $code | .appVersionName = $name' twa-manifest.json > tmp.json
          mv tmp.json twa-manifest.json

      - run: bubblewrap update --skipVersionUpgrade
      - run: bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: gasapp-android
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: es.dropdatabase.gasapp.twa
          releaseFiles: android/app-release-bundle.aab
          tracks: ${{ inputs.track }}
          status: completed
